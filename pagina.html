<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Portfólio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Changa+One:ital@0;1&family=Lexend:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;

            background-image: url(img/bg.png);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            font-family: "Poppins";
            height: 100vh;
            color: white;
        }

        .content {
            margin-left: 70px;
        }

        .content h2 {
            font-size: 1.2rem;
            color: rgb(172, 172, 172);
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 1rem;
            color: rgb(172, 172, 172);
            margin-bottom: 25px;
        }

        a {
            color: white;
            text-decoration: none;
        }

        .butons {
            display: flex;
            gap: 30px;
        }

        .btn {
            padding: 15px 35px;
            background-color: #187ff5;
            border-radius: 16px;
            margin-top: 20px;
            font-family: "Poppins";
            font-weight: bold;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.25);
            transition: transform 0.1s, background-color 0.2s;
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #3994fc;
        }
    </style>
</head>

<body>
    <main>
        <div class="content">
            <h2>Autenticação concluída</h2>
            <h1>Login realizado com sucesso!</h1>
            <p>Seja bem-vindo ao painel de teste do seu sistema de autenticação.</p>
            
            <div class="butons">
                <a href="https://nyx-portfolio-mu.vercel.app/#main" target="_blank" class="btn">Ver meu Portfólio</a>
            </div>
        </div>
    </main>
</body>

</html>
